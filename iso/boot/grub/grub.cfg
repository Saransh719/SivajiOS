set timeout=5

if [ "$grub_platform" = "efi" ]; then
    set default=0
    insmod all_video
    insmod efi_gop
    insmod gfxterm

    set gfxmode=1024x768x32
    set gfxpayload=keep

    terminal_input console
    terminal_output gfxterm
else
    terminal_input console
    terminal_output console
    set default=0
fi

if [ "$grub_platform" = "efi" ]; then
menuentry "Nigga OS (64-bit UEFI)" {
    insmod chain
    chainloader /EFI/BOOT/BOOTX64.EFI
}
menuentry "Nigga OS (32-bit Multiboot)" {
    multiboot /boot/kernel.elf
    boot
}
else
menuentry "Nigga OS (32-bit BIOS)" {
    multiboot /boot/kernel.elf
    boot
}
fi
