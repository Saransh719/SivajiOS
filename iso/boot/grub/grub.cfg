set timeout=5

if [ "$grub_platform" = "efi" ]; then
    set default=0
    insmod all_video
    insmod efi_gop
    insmod gfxterm

    set gfxmode=1024x768x32
    set gfxpayload=keep

    terminal_input console
    terminal_output gfxterm
else
    terminal_input console
    terminal_output console
    set default=0
fi

if [ "$grub_platform" = "efi" ]; then
menuentry "sivajiOS" {
    insmod chain
    chainloader /EFI/BOOT/BOOTX64.EFI
}
else
menuentry "sivajiOS" {
    multiboot /boot/kernel.elf shell
    module /modules/user.elf shell-main
    module /modules/user-fault.elf shell-fault
    boot
}
fi
